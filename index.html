<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>III HUB | Script Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <img src="public/logo.png" class="logo" alt="III HUB Logo">

        <h1 class="title">III HUB</h1>
        <p class="subtitle">Access your script after completing LootLabs</p>

        <button class="btn" id="getScriptBtn">
            Get Script
        </button>

        <!-- SCRIPT BOX (แสดงหลังทำ LootLabs เสร็จ) -->
        <div id="scriptBox" class="script-box hidden">
            <p class="script-title">Your Script:</p>
            <textarea id="scriptText" readonly>loadstring(game:HttpGet("https://yourdomain.com/script.lua"))()</textarea>
            <button class="copyBtn" id="copyBtn">Copy Script</button>
        </div>

        <p class="footer">Powered by III HUB</p>

        <!-- COPY POPUP -->
        <div id="copiedPopup" class="popup hidden">Copied!</div>

    </div>

    <script src="script.js"></script>
</body>
</html>
