<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LLL HUB Key</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#0f1724;color:#e6eef8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#0b1220;padding:28px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.6);max-width:420px;text-align:center}
    h1{margin:0 0 8px;font-size:20px}
    p{margin:8px 0 16px;color:#bcd2e8}
    .key{background:#071029;padding:12px;border-radius:6px;font-weight:700;letter-spacing:1px;color:#7fffd4}
    .btn{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:6px;background:#0ea5a2;color:#071029;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <h1>LLL HUB — Key</h1>
    <p>ขอบคุณที่สนับสนุน! คัดลอกคีย์ด้านล่างแล้วกลับไปที่เกม</p>
    <div id="key" class="key">lllhub-key-2025</div>
    <a class="btn" id="copyBtn" href="#">คัดลอกคีย์</a>
    <p style="margin-top:10px;font-size:12px;color:#99b6c8">ถ้าไม่เห็นคีย์ ติดต่อ @yourDiscord</p>
  </div>

  <script>
    document.getElementById('copyBtn').addEventListener('click', function(e){
      e.preventDefault();
      const text = document.getElementById('key').innerText;
      navigator.clipboard.writeText(text).then(function(){
        alert('คัดลอกคีย์แล้ว: ' + text);
      }, function(){ alert('ไม่สามารถคัดลอกอัตโนมัติ — คัดลอกด้วยมือได้'); });
    });
  </script>
</body>
</html>
