<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>III HUB | Script Access</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="toast">Copied!</div>

    <div class="container">

        <img src="public/logo.png" class="logo" alt="III HUB Logo">

        <h1 class="title">III HUB</h1>
        <p class="subtitle">Get your script after verification</p>

        <button class="btn" id="getScriptBtn">Get Script</button>

        <!-- Hidden until verified -->
        <div id="scriptBox" class="hidden">
            <textarea id="scriptText" readonly>
loadstring(game:HttpGet("https://your-backend-link/getscript"))()
            </textarea>

            <button class="copyBtn" id="copyBtn">Copy Script</button>
        </div>

        <p class="footer">Powered by III HUB</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
